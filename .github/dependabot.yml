# ============================================================
#  Dependabot：每周自动检查依赖更新并发起 PR（走正常 PR 流程 + CI 门禁）
#  文档：https://docs.github.com/code-security/dependabot/dependabot-version-updates
#  约定：只接受次版本 / 补丁更新；大版本（Spring Boot 4、MyBatis 4 …）需要人工评估，
#        避免自动 PR 把项目改坏。如确需升级大版本，请先开 Issue 讨论。
# ============================================================
version: 2
updates:
  # ---------- Maven 依赖（pom.xml 在仓库根目录） ----------
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Maven Wrapper 的升级会让 Dependabot 整体改写 mvnw / mvnw.cmd，
      # 制造无意义的大 diff；需要时手动执行 mvn wrapper:wrapper 升级即可。
      - dependency-name: "org.apache.maven:apache-maven"
    groups:
      # 次版本 + 补丁合并成一个 PR，减少审查负担
      maven-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------- GitHub Actions 版本（.github/workflows 里的 action） ----------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        patterns:
          - "*"
