name: CI

# 触发条件：
#   - push 到 main
#   - 向 main 发起 pull_request
#   - 在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：CI 只需要读取仓库内容
permissions:
  contents: read

# 同一 ref 的新流水线会取消旧流水线，节省 Actions 分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 注意：job id 与 name 都必须是 build。
  # main 分支保护会把它设置为「必需状态检查」（required status check），
  # 改名会导致 PR 无法合并。
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 仓库内的 mvnw 必须带可执行位；这里显式补一次，避免 "Permission denied"
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # 构建 + 单元测试 + 集成测试（测试使用 application-test.yml，H2 内存库）
      - name: Build and test
        run: ./mvnw -B -ntp verify
