name: ✨ 功能需求
description: 提出一个新功能或改进建议（对应 docs/功能模块结构.md 中的模块）
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认该功能属于哪个模块（M1 用户与登录 / M2 题库查询 / M3 做题与判卷 / M4 错题本 / M5 学习统计 / M6 管理后台 / M7 系统支撑），
        详见 [功能模块结构](https://github.com/jjxxli/user-module/blob/main/docs/功能模块结构.md)。
  - type: input
    id: module
    attributes:
      label: 所属模块
      placeholder: 例如 M1 用户与登录
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景与目标
      description: 解决什么问题？谁会用到？
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 功能描述 / 接口设计草案
      description: 涉及哪些接口、表结构、页面？可贴伪代码或示例 JSON
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 可检查的完成标准（便于拆分任务和写测试）
      placeholder: |
        - [ ] POST /api/auth/login 支持手机号登录
        - [ ] 密码错误返回统一错误码 40101
        - [ ] 有对应单元测试
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0（第一批交付）
        - P1
        - P2
      default: 1
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已确认没有相同需求的 Issue
          required: true
