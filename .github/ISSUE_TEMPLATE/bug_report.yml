name: 🐞 Bug 报告
description: 报告一个可复现的缺陷（接口报错、页面异常、构建失败等）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 [协作规范](https://github.com/jjxxli/user-module/blob/main/CONTRIBUTING.md)，
        并确认 Issues 里没有相同问题。
  - type: textarea
    id: desc
    attributes:
      label: 问题描述
      description: 发生了什么？你期望发生什么？
      placeholder: 例如：调用 POST /api/auth/register 时返回 500，期望返回统一成功结果。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供可复现的最小步骤（启动方式、请求、参数、账号）
      placeholder: |
        1. 执行 ./mvnw spring-boot:run
        2. 用 api-test.http 里的「注册」请求
        3. 观察返回
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / 报错日志
      description: 贴关键日志或截图（请先去掉数据库密码等敏感信息）
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: Windows 11 / JDK 17 / MySQL 8 / Chrome 126
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过 Issues，没有重复问题
          required: true
        - label: 我已确认问题与本项目代码相关（不是本地环境 / 密码配置问题）
          required: false
