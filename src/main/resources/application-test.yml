# ============================================================
#  测试专用配置（提交到仓库）
#  单元测试 / CI 不依赖本地 MySQL：使用 H2 内存库（MySQL 兼容模式），
#  并按 src/main/resources/db/ 下的脚本建表、灌入演示数据。
#  测试类上加 @ActiveProfiles("test") 即生效。
# ============================================================
spring:
  datasource:
    url: jdbc:h2:mem:userdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  h2:
    console:
      enabled: false

logging:
  level:
    com.example.user: info
